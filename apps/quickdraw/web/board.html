<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" /><!-- the board zooms itself; the page never does -->
  <title>Quickdraw</title>
  <link rel="stylesheet" href="/_/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
    /* versions: a list over the board */
    dialog.versions { width: min(420px, calc(100vw - 32px)); max-height: min(560px, calc(100vh - 64px)); padding: 0; border: 1px solid var(--qd-border); border-radius: 16px; background: var(--qd-pop-bg); color: var(--qd-ink-strong); box-shadow: var(--qd-pop-shadow); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
    dialog.versions::backdrop { background: #0003; }
    .versions header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
    .versions header strong { font-size: 15px; }
    .versions ul { list-style: none; margin: 0; padding: 0 8px 12px; overflow: auto; max-height: 440px; }
    .versions li { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; }
    .versions li:hover { background: var(--qd-hover); }
    .versions .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .versions .when { color: var(--qd-ink-soft); font-size: 12px; white-space: nowrap; }
    .versions .auto { color: var(--qd-ink-soft); }
    .versions button { font: inherit; font-size: 12px; border: 1px solid var(--qd-border); border-radius: 999px; padding: 3px 10px; background: transparent; color: inherit; cursor: pointer; white-space: nowrap; }
    .versions button.primary { background: var(--qd-on-bg); color: var(--qd-on-ink); border-color: transparent; }
    .versions .empty { color: var(--qd-ink-soft); padding: 8px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "yjs": "https://esm.sh/yjs@13.6.33",
        "@quickdrawjs/core": "/_/core/src/index.js",
        "quickdraw-agent": "/_/quickdraw-agent/src/index.js",
        "quickdraw-yjs": "/_/quickdraw-yjs/src/index.js",
        "quickdraw-export": "/_/quickdraw-export/src/index.js",
        "quickdraw-import": "/_/quickdraw-import/src/index.js",
        "quickdraw-markdown": "/_/quickdraw-markdown/src/index.js",
        "quickdraw-svg": "/_/quickdraw-svg/src/index.js",
        "quickdraw-embed": "/_/quickdraw-embed/src/index.js",
        "quickdraw-frames": "/_/quickdraw-frames/src/index.js",
        "quickdraw-layouts": "/_/quickdraw-layouts/src/index.js",
        "quickdraw-tickets": "/_/quickdraw-tickets/src/index.js",
        "quickdraw-members": "/_/quickdraw-members/src/index.js",
        "quickdraw-comments": "/_/quickdraw-comments/src/index.js",
        "quickdraw-gif": "/_/quickdraw-gif/src/index.js",
        "quickdraw-clipboard": "/_/quickdraw-clipboard/src/index.js",
        "quickdraw-boards": "/_/quickdraw-boards/src/index.js",
        "quickdraw-toolbar": "/_/quickdraw-toolbar/src/index.js",
        "quickdraw-screenshare": "/_/quickdraw-screenshare/src/index.js",
        "quickdraw-presence": "/_/quickdraw-presence/src/index.js",
        "quickdraw-voice": "/_/quickdraw-voice/src/index.js"
      }
    }
  </script>
</head>
<body>
  <div id="board"></div>
  <script type="module">
    import * as Y from 'yjs'
    import { createQuickdraw, pageBounds } from '@quickdrawjs/core'
    import { bindYjs } from 'quickdraw-yjs'
    import { exportTool } from 'quickdraw-export'
    import { importTool } from 'quickdraw-import'
    import { clipboardTools, copyText, createClipboard } from 'quickdraw-clipboard'
    import { bindMarkdownEditing, markdownTools, validateMarkdown, TYPE as MARKDOWN } from 'quickdraw-markdown'
    import { bindEmbeds, embedTools, validateEmbed, TYPE as EMBED } from 'quickdraw-embed'
    import { bindFrames, frameTools } from 'quickdraw-frames'
    import { bindLayouts, layoutTools } from 'quickdraw-layouts'
    import { bindKanban, bindTicketEditing, createTicketBoard, ticketTools, validateTicket, TYPE as TICKET } from 'quickdraw-tickets'
    import { bindGifs } from 'quickdraw-gif'
    import { bindBoardCards, boardCardTools, validateBoardCard, TYPE as BOARDCARD } from 'quickdraw-boards'
    import { bindMembers, bindMemberCards, bindMemberCardEditing, memberTools, validateMemberCard, CARD, createPet, isPet, petState, PET_SHEET } from 'quickdraw-members'
    import { bindComments, createComments, commentTools } from 'quickdraw-comments'
    import { createToolbar, labelsTool, MORE_ICON } from 'quickdraw-toolbar'
    import { createVersions } from '/versions.js'
    import { createAgentPanel, agentTools, buildAgentRequest, requestId, bindArrows } from 'quickdraw-agent'
    import { createVoice, voiceTools } from 'quickdraw-voice'
    import { createScreenShare, screenShareTools, pendingFeedback, markSent } from 'quickdraw-screenshare'
    import { bindAuthorship, createPresence, ACTIVITIES } from 'quickdraw-presence'
    import { UPDATE, SV, PRESENCE, AGENT, SHARE, LIVE, pack, packPresence, unpackPresence, packAgent, unpackAgent, packShare, unpackShare } from '/protocol.js'

    const board = createQuickdraw({ container: document.getElementById('board') })
    // opening a board does not draw on it (the core starts with the pen): a
    // phone or tablet starts on the hand, to move around; a computer on select
    board.editor.setTool(matchMedia('(pointer: coarse)').matches ? 'hand' : 'select')
    const ydoc = new Y.Doc()

    bindYjs(board.editor.store, ydoc)
    bindFrames(board.editor.store)
    bindLayouts(board.editor.store) // bento grids pack their cells again as they change
    bindKanban(board.editor.store) // a ticket dragged into a kanban column takes its status
    bindArrows(board.editor) // an arrow drawn between two shapes follows them as they move
    bindMarkdownEditing(board.editor) // before syncing, so remote cards draw too
    bindTicketEditing(board.editor)
    const embeds = bindEmbeds(board.editor) // allowed URLs; inline HTML runs only when you press Run
    bindGifs(board.editor) // GIFs move (the canvas alone shows their first frame)

    // link previews through the server's /preview proxy (browsers cannot read
    // other sites' HTML); the card keeps what it got, so viewers never contact the site
    async function fetchPreview(url) {
      const r = await fetch('/preview?url=' + encodeURIComponent(url))
      if (!r.ok) return null
      const p = await r.json()
      if (p.image) p.image = await (await fetch(p.image)).blob() // the package shrinks it
      return p
    }

    // the AI panel: agents on this board and requests to them, through the relay
    // (AGENT messages, /protocol.js), which keeps the threads
    let agents = []
    const panelListeners = new Set()
    const toPanel = (event) => panelListeners.forEach((fn) => fn(event))
    function sendAgent(message) {
      if (ws?.readyState !== WebSocket.OPEN) throw new Error('Not connected to the board; try again in a moment.')
      ws.send(packAgent(message))
    }
    const panel = createAgentPanel({ editor: board.editor, host: {
      agents: () => agents,
      threads: () => [], // they come once connected
      onEvent(fn) { panelListeners.add(fn); return () => panelListeners.delete(fn) },
      ask: (request) => {
        sendAgent({ kind: 'request', request })
        // the snapshots' feedback went out as it is now: it comes back only when it changes
        if (request.context.feedback?.length) markSent(board.editor.store, request.context.feedback)
      },
      // snapshots written on since they last went to an agent: they go with the next request
      feedback: () => pendingFeedback(board.editor.store).map((f) => ({ id: f.frameId, label: `📸 ${f.title}`, count: f.shapeIds.length })),
      reply: (requestId, message) => sendAgent({ kind: 'reply', requestId, message }),
      // an agent is its owner's (it runs on their account): the server says whom it takes requests from
      cannotAsk: (agent) => (agent.canAsk === false ? `${agent.name} runs on ${agent.owner?.name ? agent.owner.name + '\'s' : 'someone else\'s'} account: only ${agent.owner?.name ?? 'they'} can ask it, unless they open it to you.` : undefined),
      join: () => ({ text: `Bring your own: install the quickdraw skill on your computer (once), then ask your agent — Claude Code, Codex, pi or any that reads skills — to join this board (${boardRef()}). Only you can ask it, unless you open it to others.`, command: SKILL_INSTALL }),
      // its owner opens an agent to everyone, or to people here (their presence ids), or closes it
      share: (agentId, withWhom) => sendAgent({ kind: 'share', agent: agentId, with: withWhom }),
      people: () => presence.peers().filter((p) => !p.agent && p.name).map((p) => ({ id: p.id, name: p.name })),
    } })
    // this board for an agent: its id where that is enough (the default
    // server), else its page URL, which says the server too
    const boardRef = () => (/^http:\/\/(localhost|127\.0\.0\.1):8795$/.test(location.origin) ? boardId : location.origin + '/b/' + boardId)
    // what teaches the agents on a computer the omq command (skills/quickdraw)
    const SKILL_INSTALL = 'omq skill install'
    function onAgentMessage(m) {
      if (m.kind === 'you') { if (m.person) presence.suggestName(m.person); toPanel({ type: 'agents' }) } // your name, until you choose one
      else if (m.kind === 'agents') { agents = m.agents; toPanel({ type: 'agents' }); teamBoard.refresh() }
      else if (m.kind === 'threads') toPanel({ type: 'threads', threads: m.threads })
      else if (m.kind === 'thread') toPanel({ type: 'thread', thread: m.thread })
      else if (m.kind === 'event') toPanel({ type: 'event', event: m.event })
      else if (m.kind === 'voice') toVoice(m.sdp ? { kind: 'answer', id: m.requestId, sdp: m.sdp } : { kind: 'end', id: m.requestId, reason: m.end })
    }

    // talking with an agent (quickdraw-voice): the call is a request carrying the
    // WebRTC offer; the agent answers through the relay, and the sound then goes
    // straight between this page and the voice model. Its thread is in the panel.
    const voiceListeners = new Set()
    const toVoice = (m) => voiceListeners.forEach((fn) => fn(m))
    const voice = createVoice({ editor: board.editor, host: {
      agent: () => agents.find((a) => a.voice && a.canAsk !== false) ?? null,
      start(agent, sdp) {
        // about what is selected, like a written request
        const selected = [...board.editor.selection].map((id) => board.editor.store.get(id)).filter(Boolean)
        const v = board.editor.viewportPageBounds()
        const request = buildAgentRequest({
          id: requestId(), to: agent.id, text: '🎙 Voice conversation', editor: board.editor,
          shapeIds: selected.map((s) => s.id), frameIds: selected.filter((s) => s.isFrame).map((s) => s.id),
          anchor: selected[0] ? { shapeId: selected[0].id, x: selected[0].x, y: selected[0].y } : { x: v.x + v.w / 2, y: v.y + v.h / 2 },
          options: panel.optionsFor(agent.id), // its voice (and model, effort) as picked in the AI panel
        })
        sendAgent({ kind: 'request', request, sdp })
        toPanel({ type: 'thread', thread: { request, events: [], diffs: [], status: 'working' } }) // the server tells the others
        return request.id
      },
      stop: (requestId) => { if (ws?.readyState === WebSocket.OPEN) ws.send(packAgent({ kind: 'voice', requestId, stop: true })) },
      onMessage(fn) { voiceListeners.add(fn); return () => voiceListeners.delete(fn) },
    } })

    // screen sharing (quickdraw-screenshare): its messages go over the relay
    // (SHARE; the frames as LIVE), so one person shares and everyone watches
    const shareListeners = new Set()
    const toShare = (m) => shareListeners.forEach((fn) => fn(m))
    const share = createScreenShare({ editor: board.editor, host: {
      me: () => ({ name: presence.me().name }),
      send: (m) => { if (ws?.readyState === WebSocket.OPEN) ws.send(packShare(m)) },
      sendFrame: (jpeg) => { if (ws?.readyState === WebSocket.OPEN) ws.send(pack(LIVE, jpeg)) },
      canSend: () => ws?.readyState === WebSocket.OPEN && ws.bufferedAmount === 0,
      onMessage(fn) { shareListeners.add(fn); return () => shareListeners.delete(fn) },
    } })

    // shapes from other packages, checked by their own validators: in an imported file, or pasted
    const shapeTypes = { [MARKDOWN]: validateMarkdown, [EMBED]: validateEmbed, [TICKET]: validateTicket, [CARD]: validateMemberCard, [BOARDCARD]: validateBoardCard }
    // a board in this board (quickdraw-boards): a card for another board, its picture or a live window onto it
    const boardHost = {
      boards: async () => (await (await fetch('/api/boards')).json()),
      thumbnail: (id, at) => (at ? `/api/boards/${id}/thumbnail?at=${encodeURIComponent(at)}` : null),
      view: (id) => `/b/${id}/view`,
      open: (id) => { location.href = `/b/${id}` },
      get current() { return location.pathname.split('/').pop() },
    }
    bindBoardCards(board.editor, boardHost)
    const boardCards = boardCardTools(boardHost)
    // copy and paste through the browser's own clipboard events: any browser, plain http too
    // (shapes for a board, their text for elsewhere; images, SVG code, and other text as a note);
    // Paste on the rail and Copy on a selected shape, for a phone
    const clip = clipboardTools(createClipboard(board.editor, { types: shapeTypes }))
    // the right rail puts things on the board; the selection bar acts on the selected one.
    // Markdown and embeds hide themselves on a core without registerShapeType.
    const svg = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`
    const ICONS = {
      boards: svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
      terminal: svg('<path d="m4 17 6-5-6-5"/><path d="M12 19h8"/>'),
      rename: svg('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>'),
      versions: svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>'),
    }
    let versions = null // made when first opened

    const frames = frameTools()
    const layouts = layoutTools()
    const cards = markdownTools()
    const web = embedTools(embeds, { fetchPreview })
    const ai = agentTools(panel)
    // the team (quickdraw-members: agents' roles, in the board's doc) and every ticket, in a panel beside the board
    const members = bindMembers(ydoc)
    const same = (a, b) => String(a).toLowerCase() === String(b).toLowerCase()
    function team() {
      const here = [...agents, ...presence.peers().filter((p) => p.agent && p.name)]
      const names = []
      for (const n of [...here.map((a) => a.name), ...members.list().map((m) => m.name)]) if (!names.some((x) => same(x, n))) names.push(n)
      return names.map((name) => {
        const a = agents.find((x) => same(x.name, name)), p = presence.peers().find((x) => x.agent && same(x.name, name)), m = members.get(name)
        const act = p?.agentActivity && (ACTIVITIES[p.agentActivity] + (p.agentNote ? ': ' + p.agentNote : ''))
        return { name, role: m?.role, about: m?.about, here: !!(a || p), status: a?.status ?? p?.agentStatus, doing: act || undefined, elsewhere: a?.elsewhere }
      })
    }
    // agents' pets (Codex pets, from the table): one playing by each cursor, one in the Team panel
    const pets = { cursor: new Map(), panel: new Map() }
    function petOf(where, name, height) {
      const m = members.get(name)
      const src = isPet(m?.avatar) ? board.editor.store.asset(m.avatar.asset)?.src : null
      const had = pets[where].get(name.toLowerCase())
      if (had && had.src === src) return had.pet
      had?.pet.destroy()
      if (!src) { pets[where].delete(name.toLowerCase()); return null }
      const pet = createPet(src, { height })
      pets[where].set(name.toLowerCase(), { src, pet })
      return pet
    }
    const peerOf = (name) => presence.peers().find((p) => p.agent && same(p.name, name))
    async function setAvatar(name, file) {
      const src = await new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => fail(new Error('Could not read it')); r.readAsDataURL(file) })
      const size = await new Promise((ok) => { const img = new Image(); img.onload = () => ok({ w: img.naturalWidth, h: img.naturalHeight }); img.onerror = () => ok(null); img.src = src })
      if (!size || size.w !== PET_SHEET.w || size.h !== PET_SHEET.h) throw new Error(`Not a Codex pet's sheet (${PET_SHEET.w} × ${PET_SHEET.h})`)
      // shown 44 px tall: half the size is plenty, and a tenth of the bytes on the board
      const half = await new Promise((ok) => {
        const img = new Image()
        img.onload = () => {
          const c = Object.assign(document.createElement('canvas'), { width: size.w / 2, height: size.h / 2 })
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
          const webp = c.toDataURL('image/webp', 0.85)
          ok(webp.startsWith('data:image/webp') ? webp : c.toDataURL('image/png'))
        }
        img.src = src
      })
      const asset = 'asset:pet-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
      const was = members.get(name)?.avatar
      board.editor.store.put({ id: asset, typeName: 'asset', src: half, w: size.w / 2, h: size.h / 2 })
      members.set(name, { avatar: { kind: 'codex-pet', name: file.name.replace(/\.\w+$/, ''), asset } }, presence.me().name)
      if (isPet(was) && !members.list().some((m) => m.avatar?.asset === was.asset)) board.editor.store.remove([was.asset])
    }
    const teamBoard = createTicketBoard({
      editor: board.editor, team, setRole: (name, role) => members.set(name, { role }, presence.me().name), setAvatar,
      avatar: (m) => { const pet = petOf('panel', m.name, 44); const p = peerOf(m.name); pet?.play(petState({ activity: p?.agentActivity, status: m.status })); return pet?.el ?? null },
    })
    members.onChange(teamBoard.refresh)
    bindMemberCards(board.editor.store, members) // profile cards on the board show what the table says
    bindMemberCardEditing(board.editor, members, { me: () => presence.me() })
    const cardTools = memberTools({ members, agents: () => [...agents, ...presence.peers().filter((p) => p.agent && p.name)], me: () => presence.me() })
    // comments: a thread on a frame, by its top-right corner (quickdraw-comments, in the board's doc)
    const comments = createComments({ editor: board.editor, comments: bindComments(ydoc), me: () => presence.me() })
    const commenting = commentTools(comments)
    // tickets: work left for agents; one is addressed to an agent here (joined, or waiting from the CLI)
    const tickets = ticketTools({
      agents: () => [...agents, ...presence.peers().filter((p) => p.agent && p.name)],
      me: () => ({ name: presence.me().name }),
      board: teamBoard,
    })
    createToolbar(board.editor, {
      rail: [
        ...ai.rail, ...voiceTools(voice).rail, '-',
        ...clip.rail,
        ...tickets.rail, ...cardTools.rail, ...boardCards.rail, ...frames.rail, ...layouts.rail, ...cards.rail, ...web.rail,
        '-',
        { id: 'more', title: 'More', icon: MORE_ICON, menu: [
          { id: 'boards', title: 'All boards', icon: ICONS.boards, run: () => { location.href = '/' } },
          { id: 'rename', title: 'Rename board…', icon: ICONS.rename, run: renameBoard },
          { id: 'versions', title: 'Versions…', icon: ICONS.versions, run: () => (versions ??= createVersions(boardId, board.editor.container)).open() },
          { id: 'skill-install', title: 'Bring your own AI', icon: ICONS.terminal, run: copySkillInstall },
          labelsTool(),
          '-',
          ...screenShareTools(share).menu,
          '-',
          // Markdown cards, embeds and tickets are allowed in, checked by their own validators
          importTool({ types: shapeTypes }),
          exportTool(),
        ] },
      ],
      context: [...ai.context, ...clip.context, ...boardCards.context, ...tickets.context, ...cardTools.context, ...frames.context, ...commenting.context, ...layouts.context, ...cards.context, ...web.context],
    })

    // this board: /b/<id>; its relay is /ws/<id> (/protocol.js), which also persists it
    const boardId = location.pathname.split('/').pop()
    let boardTitle = ''
    const showTitle = (b) => { if (b) { boardTitle = b.title; document.title = `${b.title} — Quickdraw` } }
    fetch('/api/boards/' + boardId).then((r) => r.ok && r.json()).then(showTitle)
    async function copySkillInstall() {
      const copied = await copyText(SKILL_INSTALL)
      const then = `then ask your agent (Claude Code, Codex, pi…) to join this board: ${boardRef()}`
      prompt(copied ? `Copied. Run it once on your computer to teach your agents the omq command; ${then}` : `Run this once on your computer to teach your agents the omq command; ${then}`, SKILL_INSTALL)
    }
    async function renameBoard() {
      const title = prompt('Board title', boardTitle)
      if (title == null) return
      const r = await fetch('/api/boards/' + boardId, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) })
      if (r.ok) showTitle(await r.json())
    }
    let ws = null
    ydoc.on('update', (update, origin) => {
      if (origin !== 'relay' && ws?.readyState === WebSocket.OPEN) ws.send(pack(UPDATE, update))
    })
    function connect() {
      ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${boardId}`)
      ws.binaryType = 'arraybuffer'
      ws.onopen = () => {
        // push everything we have (edits made while offline), then ask for the rest
        ws.send(pack(UPDATE, Y.encodeStateAsUpdate(ydoc)))
        ws.send(pack(SV, Y.encodeStateVector(ydoc)))
        ws.send(packAgent({ kind: 'hello' })) // the agents here and the threads
        if (share.sharing) { // still sharing, after a reconnect: and still letting agents see it, if so
          const agents = share.agents
          ws.send(packShare({ kind: 'start', name: presence.me().name }))
          if (agents) ws.send(packShare({ kind: 'agents', allow: true }))
        }
        presence.resend()
      }
      ws.onmessage = ({ data }) => {
        const m = new Uint8Array(data)
        if (m[0] === UPDATE) Y.applyUpdate(ydoc, m.subarray(1), 'relay')
        else if (m[0] === PRESENCE) { const p = unpackPresence(m); presenceListeners.forEach((fn) => fn(p)); if (p.agent || p.gone) teamBoard.refresh() }
        else if (m[0] === AGENT) onAgentMessage(unpackAgent(m))
        else if (m[0] === LIVE) toShare({ kind: 'frame', data: m.subarray(1) })
        else if (m[0] === SHARE) toShare(unpackShare(m))
      }
      ws.onclose = () => {
        presence.clear()
        agents = []
        toPanel({ type: 'agents' })
        if (!share.sharing) toShare({ kind: 'sharing', sharer: null }) // a sharer here goes on, and says so again when back
        voice.stop() // the server hung up for us
        setTimeout(connect, 1000)
      }
    }

    // who is here (quickdraw-presence): everyone's cursor with their name,
    // colour and status, following someone; over the relay as PRESENCE
    const editor = board.editor
    const ua = navigator.userAgent
    const presenceListeners = new Set()
    const presence = createPresence({ editor, avatar: (p, { dx }) => {
      const pet = petOf('cursor', p.name, 44)
      pet?.play(petState({ activity: p.agentActivity, status: p.agentStatus, dx }))
      return pet?.el ?? null
    }, defaults: {
      name: /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : 'Guest', // until you name yourself
    }, host: {
      send: (p) => { if (ws?.readyState === WebSocket.OPEN) ws.send(packPresence(p)) },
      onMessage(fn) { presenceListeners.add(fn); return () => presenceListeners.delete(fn) },
    } })

    // who made what, and who changed it last: marked as you do it (agents mark theirs)
    bindAuthorship(board.editor.store, { me: () => presence.me() })

    connect()

    // the list's picture of this board: drawn here once it settles (and when
    // the page is left), whoever changed it — people or an agent
    const THUMB = { w: 480, h: 300 }
    let changed = false, settle = null
    async function drawThumbnail() {
      const shapes = editor.store.shapes()
      if (!shapes.length) return null
      const bs = shapes.map(pageBounds)
      const w = Math.max(...bs.map((b) => b.x + b.w)) - Math.min(...bs.map((b) => b.x)) + 96
      const h = Math.max(...bs.map((b) => b.y + b.h)) - Math.min(...bs.map((b) => b.y)) + 96
      const png = await editor.exportImage({ background: true, margin: 48, scale: Math.min(1, (2 * THUMB.w) / w, (2 * THUMB.h) / h) })
      if (!png) return null
      const img = await createImageBitmap(png)
      const canvas = Object.assign(document.createElement('canvas'), { width: THUMB.w, height: THUMB.h })
      const ctx = canvas.getContext('2d')
      ctx.fillStyle = editor.theme.background
      ctx.fillRect(0, 0, THUMB.w, THUMB.h)
      const k = Math.min(THUMB.w / img.width, THUMB.h / img.height)
      ctx.drawImage(img, (THUMB.w - img.width * k) / 2, (THUMB.h - img.height * k) / 2, img.width * k, img.height * k)
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82))
    }
    async function sendThumbnail(leaving = false) {
      if (!changed) return
      changed = false
      const blob = await drawThumbnail().catch(() => null)
      if (blob) fetch(`/api/boards/${boardId}/thumbnail`, { method: 'PUT', headers: { 'content-type': 'image/jpeg' }, body: blob, keepalive: leaving }).catch(() => {})
    }
    editor.store.listen(() => {
      changed = true
      clearTimeout(settle)
      settle = setTimeout(sendThumbnail, 4000)
    }, { source: 'all' })
    addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') sendThumbnail(true) })

    window.board = board
    window.ydoc = ydoc
  </script>
</body>
</html>
