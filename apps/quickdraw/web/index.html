<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boards — Quickdraw</title>
  <style>
    :root { --bg: #fafaf8; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0; --accent: #1971c2; --menu: #fff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f2; --muted: #9a9aa0; --line: #333336; --accent: #4dabf7; --menu: #2c2c2e; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 32px 16px; }
    form, .tools { max-width: 640px; }
    h1 { font-size: 22px; margin: 0 0 20px; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
    button { font: inherit; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button.plain { background: transparent; color: var(--accent); padding: 4px 0; font-size: 14px; }
    .tools { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    li { position: relative; border: 1px solid var(--line); border-radius: 12px; }
    li a { display: block; color: inherit; text-decoration: none; }
    li a:hover .title { color: var(--accent); }
    .thumb { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: contain; border-radius: 11px 11px 0 0; background: var(--line); }
    .no-thumb { display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .info { display: grid; gap: 2px; padding: 8px 40px 10px 12px; }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .meta { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
    .ai { color: var(--accent); }
    .empty { color: var(--muted); padding: 12px 4px; border: 0; }
    li details { position: absolute; right: 4px; bottom: 6px; }
    summary { list-style: none; cursor: pointer; padding: 8px 10px; color: var(--muted); border-radius: 8px; }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: var(--line); }
    .menu { position: absolute; right: 0; top: 100%; z-index: 1; display: grid; min-width: 150px; padding: 4px; background: var(--menu); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px #0002; }
    .menu button { background: transparent; color: inherit; text-align: left; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
    .menu button:hover { background: var(--line); }
    h2 { font-size: 15px; color: var(--muted); font-weight: 500; margin: 32px 0 4px; }
    .error { color: #c92a2a; font-size: 14px; }
    header { display: flex; align-items: baseline; gap: 16px; margin: 0 0 20px; }
    header h1 { margin: 0; }
    header a { color: var(--accent); font-size: 14px; text-decoration: none; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 40px 8px 12px; }
    .tag { font: inherit; font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
    .tag:hover, .tag.on { color: var(--accent); border-color: var(--accent); }
    #filter { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header><h1>Boards</h1><a href="/graph">Graph</a></header>
    <form id="new">
      <input name="title" placeholder="New board title" aria-label="New board title" autocomplete="off" />
      <button>Create</button>
    </form>
    <div class="tools">
      <button class="plain" id="from-file" type="button">New from a JSON file…</button>
      <input id="file" type="file" accept="application/json,.json" hidden />
      <span id="filter" hidden></span>
      <span class="error" id="error"></span>
    </div>
    <ul id="boards"></ul>
    <button class="plain" id="show-archived" type="button" hidden></button>
    <section id="archived" hidden>
      <h2>Archived</h2>
      <ul id="archived-boards"></ul>
    </section>
  </main>
  <script type="module">
    // The boards on this server: open, make (empty, from a JSON file, as a
    // copy), rename, tag, archive and bring back; find them by tag. Boards save themselves as they change.
    const $ = (id) => document.getElementById(id)
    const el = (tag, props = {}, ...children) => { const e = Object.assign(document.createElement(tag), props); e.append(...children); return e }
    const api = async (method, path, body) => {
      const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) })
      const data = await r.json().catch(() => ({}))
      if (!r.ok) throw new Error(data.error || r.statusText)
      return data
    }
    const fail = (e) => { $('error').textContent = e.message }
    const open = (b) => { location.href = '/b/' + b.id }
    let tag = new URLSearchParams(location.search).get('tag') // the boards with this tag only
    const filterBy = (t) => { tag = t; history.replaceState(null, '', t ? '?tag=' + encodeURIComponent(t) : location.pathname); show() }
    const tagsOf = (b) => b.tags ?? []

    function row(b, archived) {
      const meta = [b.agents ? `✦ ${b.agents === 1 ? 'AI' : b.agents + ' AIs'} here` : '', new Date(b.createdAt).toLocaleDateString()].filter(Boolean).join(' · ')
      // the picture a page last drew of it (a board not opened since has none yet)
      const thumb = b.thumbnailAt
        ? el('img', { className: 'thumb', alt: '', loading: 'lazy', src: `/api/boards/${b.id}/thumbnail?at=${encodeURIComponent(b.thumbnailAt)}` })
        : el('span', { className: 'thumb no-thumb', textContent: 'Open it to see it here' })
      const link = el('a', { href: '/b/' + b.id }, thumb, el('span', { className: 'info' }, el('span', { className: 'title', textContent: b.title }), el('span', { className: 'meta' + (b.agents ? ' ai' : ''), textContent: meta })))
      const actions = archived
        ? [['Bring back', () => api('PATCH', '/api/boards/' + b.id, { archived: false }).then(show, fail)]]
        : [
            ['Rename…', () => { const t = prompt('Board title', b.title); if (t != null) api('PATCH', '/api/boards/' + b.id, { title: t }).then(show, fail) }],
            ['Tags…', () => { const t = prompt('Tags, separated by commas', tagsOf(b).join(', ')); if (t != null) api('PATCH', '/api/boards/' + b.id, { tags: t.split(',') }).then(show, fail) }],
            ['Duplicate', () => api('POST', '/api/boards', { from: b.id }).then(show, fail)],
            ['Archive', () => api('PATCH', '/api/boards/' + b.id, { archived: true }).then(show, fail)],
          ]
      const tags = tagsOf(b).length ? el('span', { className: 'tags' }, ...tagsOf(b).map((t) => el('button', { type: 'button', className: 'tag' + (tag && t.toLowerCase() === tag.toLowerCase() ? ' on' : ''), textContent: t, title: 'Boards tagged ' + t, onclick: () => filterBy(t) }))) : ''
      const menu = el('div', { className: 'menu' }, ...actions.map(([label, run]) => el('button', { type: 'button', textContent: label, onclick: (e) => { e.target.closest('details').open = false; run() } })))
      return el('li', {}, link, tags, el('details', {}, el('summary', { textContent: '…', title: 'More' }), menu))
    }

    async function show() {
      $('error').textContent = ''
      const q = tag ? '?tag=' + encodeURIComponent(tag) : ''
      const [boards, archived] = await Promise.all([api('GET', '/api/boards' + q), api('GET', '/api/boards?archived=1' + (tag ? '&tag=' + encodeURIComponent(tag) : ''))])
      $('filter').hidden = !tag
      if (tag) $('filter').replaceChildren(el('span', { textContent: 'Tagged ' + tag }), el('button', { type: 'button', className: 'plain', textContent: 'Show all', onclick: () => filterBy(null) }))
      $('boards').replaceChildren(...boards.toReversed().map((b) => row(b)))
      if (!boards.length) $('boards').append(el('li', { className: 'empty', textContent: tag ? 'No boards with this tag.' : 'No boards yet.' }))
      $('archived-boards').replaceChildren(...archived.map((b) => row(b, true)))
      if (!archived.length) $('archived').hidden = true
      $('show-archived').hidden = !archived.length
      $('show-archived').textContent = `${$('archived').hidden ? 'Show' : 'Hide'} archived (${archived.length})`
    }

    $('new').onsubmit = (e) => {
      e.preventDefault()
      api('POST', '/api/boards', { title: e.target.title.value.trim() || undefined }).then(open, fail)
    }
    // a JSON file (as a board's Export writes it) becomes a new board
    $('from-file').onclick = () => $('file').click()
    $('file').onchange = async () => {
      const file = $('file').files[0]
      $('file').value = ''
      if (!file) return
      try {
        const data = JSON.parse(await file.text())
        open(await api('POST', '/api/boards', { title: file.name.replace(/\.json$/i, ''), file: data }))
      } catch (e) { fail(e) }
    }
    $('show-archived').onclick = () => { $('archived').hidden = !$('archived').hidden; show() }
    document.addEventListener('click', (e) => { for (const d of document.querySelectorAll('details[open]')) if (!d.contains(e.target)) d.open = false })

    show()
  </script>
</body>
</html>
