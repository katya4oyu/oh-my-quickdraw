<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Boards — Quickdraw</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
    .new { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .new .field { flex: 1 1 260px; }
    .filter { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--t-s); }
    ul.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    @media (max-width: 600px) { ul.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
    .section-head { display: flex; align-items: center; gap: 12px; }
    .section-head h2 { margin: 0; font-size: var(--t-s); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div id="top"></div>
  <main>
    <form class="new" id="new">
      <input class="field" name="title" placeholder="New board title" aria-label="New board title" autocomplete="off" />
      <button class="btn">Create</button>
      <button class="btn quiet" id="from-file" type="button">From a JSON file…</button>
      <input id="file" type="file" accept="application/json,.json" hidden />
    </form>
    <div class="filter" id="filter" hidden></div>
    <span class="error" id="error"></span>
    <ul class="cards" id="boards"></ul>
    <section id="archived-section" hidden>
      <div class="section-head"><h2>Archived</h2><button class="btn quiet" id="show-archived" type="button"></button></div>
      <ul class="cards" id="archived" hidden></ul>
    </section>
  </main>
  <script type="module">
    // The boards on this server: open, make (empty, from a JSON file, as a
    // copy), rename, tag, archive and bring back; find them by tag. Boards
    // save themselves as they change.
    import { $, el, api, bar, chip, icon, thumbnailUrl, when, agentsText } from '/app.js'
    $('top').replaceWith(bar('Boards'))
    const fail = (e) => { $('error').textContent = e.message }
    const open = (b) => { location.href = '/b/' + b.id }
    let tag = new URLSearchParams(location.search).get('tag') // the boards with this tag only
    let showArchived = false
    const filterBy = (t) => { tag = t; history.replaceState(null, '', t ? '?tag=' + encodeURIComponent(t) : location.pathname); show() }

    function card(b, archived) {
      const url = thumbnailUrl(b)
      const pic = url ? el('img', { className: 'pic', alt: '', loading: 'lazy', src: url }) : el('span', { className: 'pic none', textContent: 'Open it to see it here' })
      const meta = el('span', { className: 'meta' }, when(b), b.agents ? ' · ' : '', b.agents ? el('span', { className: 'ai', textContent: agentsText(b) }) : null)
      const tags = (b.tags ?? []).length ? el('span', { className: 'chips' }, ...b.tags.map((t) => chip(t, { on: !!tag && t.toLowerCase() === tag.toLowerCase(), onclick: () => filterBy(t) }))) : null
      const actions = archived
        ? [['Bring back', () => api('PATCH', '/api/boards/' + b.id, { archived: false }).then(show, fail)]]
        : [
            ['Rename…', () => { const t = prompt('Board title', b.title); if (t != null) api('PATCH', '/api/boards/' + b.id, { title: t }).then(show, fail) }],
            ['Tags…', () => { const t = prompt('Tags, separated by commas', (b.tags ?? []).join(', ')); if (t != null) api('PATCH', '/api/boards/' + b.id, { tags: t.split(',') }).then(show, fail) }],
            ['Duplicate', () => api('POST', '/api/boards', { from: b.id }).then(show, fail)],
            ['Archive', () => api('PATCH', '/api/boards/' + b.id, { archived: true }).then(show, fail)],
          ]
      const menu = el('div', { className: 'menu' }, ...actions.map(([label, run]) => el('button', { type: 'button', textContent: label, onclick: (e) => { e.target.closest('details').open = false; run() } })))
      const more = el('summary', { title: 'More', ariaLabel: 'More' }); more.append(icon('more'))
      return el('li', { className: 'card' },
        el('a', { href: '/b/' + b.id }, pic, el('span', { className: 'body' }, el('span', { className: 'title', textContent: b.title }), meta)),
        tags ? el('div', { className: 'body', style: 'padding-top:0' }, tags) : null,
        el('details', {}, more, menu))
    }

    async function show() {
      $('error').textContent = ''
      const q = tag ? 'tag=' + encodeURIComponent(tag) : ''
      const [boards, archived] = await Promise.all([api('GET', '/api/boards' + (q ? '?' + q : '')), api('GET', '/api/boards?archived=1' + (q ? '&' + q : ''))])
      $('filter').hidden = !tag
      if (tag) $('filter').replaceChildren('Boards tagged', chip(tag, { on: true, remove: true, onclick: () => filterBy(null) }))
      $('boards').replaceChildren(...boards.toReversed().map((b) => card(b)))
      if (!boards.length) $('boards').append(el('li', { className: 'empty', textContent: tag ? 'No boards with this tag.' : 'No boards yet: give the first one a title above.' }))
      $('archived').replaceChildren(...archived.map((b) => card(b, true)))
      $('archived-section').hidden = !archived.length
      $('archived').hidden = !showArchived
      $('show-archived').textContent = `${showArchived ? 'Hide' : 'Show'} (${archived.length})`
    }

    $('new').onsubmit = (e) => {
      e.preventDefault()
      api('POST', '/api/boards', { title: e.target.title.value.trim() || undefined }).then(open, fail)
    }
    // a JSON file (as a board's Export writes it) becomes a new board
    $('from-file').onclick = () => $('file').click()
    $('file').onchange = async () => {
      const file = $('file').files[0]
      $('file').value = ''
      if (!file) return
      try {
        const data = JSON.parse(await file.text())
        open(await api('POST', '/api/boards', { title: file.name.replace(/\.json$/i, ''), file: data }))
      } catch (e) { fail(e) }
    }
    $('show-archived').onclick = () => { showArchived = !showArchived; show() }
    document.addEventListener('click', (e) => { for (const d of document.querySelectorAll('details[open]')) if (!d.contains(e.target)) d.open = false })

    show()
  </script>
</body>
</html>
