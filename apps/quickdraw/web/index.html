<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boards — Quickdraw</title>
  <style>
    :root { --bg: #fafaf8; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0; --accent: #1971c2; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f2; --muted: #9a9aa0; --line: #333336; --accent: #4dabf7; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 22px; margin: 0 0 20px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
    button { font: inherit; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; }
    li a { display: flex; justify-content: space-between; gap: 16px; padding: 12px 4px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
    li a:hover .title { color: var(--accent); }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Boards</h1>
    <form id="new">
      <input name="title" placeholder="New board title" aria-label="New board title" autocomplete="off" />
      <button>Create</button>
    </form>
    <ul id="boards"></ul>
  </main>
  <script type="module">
    const list = document.getElementById('boards')

    async function show() {
      const boards = await (await fetch('/api/boards')).json()
      list.replaceChildren(...boards.toReversed().map((b) => {
        const li = document.createElement('li')
        const a = Object.assign(document.createElement('a'), { href: '/b/' + b.id })
        const title = Object.assign(document.createElement('span'), { className: 'title', textContent: b.title })
        const meta = Object.assign(document.createElement('span'), { className: 'meta', textContent: `${b.id} · ${new Date(b.createdAt).toLocaleDateString()}` })
        a.append(title, meta)
        li.append(a)
        return li
      }))
      if (!boards.length) list.innerHTML = '<li class="empty">No boards yet.</li>'
    }

    document.getElementById('new').onsubmit = async (e) => {
      e.preventDefault()
      const title = e.target.title.value.trim()
      const r = await fetch('/api/boards', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: title || undefined }) })
      if (r.ok) location.href = '/b/' + (await r.json()).id
    }

    show()
  </script>
</body>
</html>
