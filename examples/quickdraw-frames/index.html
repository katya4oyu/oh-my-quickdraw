<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quickdraw — frames example</title>
  <link rel="stylesheet" href="../../vendor/quickdraw/packages/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
    .actions { position: fixed; top: 10px; right: 10px; z-index: 50; display: flex; gap: 6px; }
    .actions button {
      font: 500 13px system-ui; padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.15); background: #fff; cursor: pointer;
    }
  </style>
  <!-- in your own project, a bundler resolves this from node_modules -->
  <script type="importmap">
    { "imports": { "@quickdrawjs/core": "../../vendor/quickdraw/packages/core/src/index.js" } }
  </script>
</head>
<body>
  <div id="board"></div>
  <div class="actions">
    <button id="frame">Add frame</button>
    <button id="frame-export">Export frame</button>
  </div>
  <script type="module">
    import { createQuickdraw } from '@quickdrawjs/core'
    import { bindFrames, createFrame, frameShapeIds, isFrame } from '../../packages/quickdraw-frames/src/index.js'

    const board = createQuickdraw({ container: document.getElementById('board') })
    const { editor } = board
    bindFrames(editor.store)

    // a frame in the middle of the view, capturing what is already inside
    document.getElementById('frame').onclick = () => {
      const v = editor.viewportPageBounds()
      const w = Math.min(480, v.w * 0.8), h = Math.min(320, v.h * 0.6)
      const id = createFrame(editor.store, { x: v.x + (v.w - w) / 2, y: v.y + (v.h - h) / 2, w, h })
      editor.setTool('select')
      editor.setSelection([id])
    }

    // the selected frame, or the frame of the selected shape, as a PNG
    document.getElementById('frame-export').onclick = async () => {
      const s = editor.store.get([...editor.selection][0])
      const frameId = isFrame(s) ? s.id : s?.frameId
      if (!frameId) return alert('Select a frame first')
      const blob = await editor.exportImage({ ids: frameShapeIds(editor.store, frameId) })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = (editor.store.get(frameId + '-title')?.props.text || 'frame') + '.png'
      a.click()
      setTimeout(() => URL.revokeObjectURL(a.href), 5000)
    }
  </script>
</body>
</html>
