<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quickdraw — Markdown example</title>
  <link rel="stylesheet" href="../../vendor/quickdraw/packages/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
    .actions { position: fixed; top: 10px; right: 10px; z-index: 50; display: flex; gap: 6px; }
    .actions button {
      font: 500 13px system-ui; padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.15); background: #fff; cursor: pointer;
    }
  </style>
  <!-- in your own project, a bundler resolves this from node_modules -->
  <script type="importmap">
    { "imports": { "@quickdrawjs/core": "../../vendor/quickdraw/packages/core/src/index.js" } }
  </script>
</head>
<body>
  <div id="board"></div>
  <div class="actions">
    <button id="add">Add Markdown</button>
    <button id="edit">Edit</button>
  </div>
  <script type="module">
    import { createQuickdraw } from '@quickdrawjs/core'
    import { bindMarkdownEditing, createMarkdown, editMarkdown, TYPE } from '../../packages/quickdraw-markdown/src/index.js'

    const board = createQuickdraw({ container: document.getElementById('board') })
    const { editor } = board
    bindMarkdownEditing(editor) // registers the shape type; double-click edits

    const SAMPLE = `# Markdown card

Drawn on the **canvas**, so it stacks, rotates and exports like any shape.

- lists, *emphasis*, \`code\`
  - nested items
1. numbered, too

> Double-click to edit (or use **Edit** on touch devices).

\`\`\`
const md = 'fenced code'
\`\`\``

    document.getElementById('add').onclick = () => {
      const v = editor.viewportPageBounds()
      const w = Math.min(360, v.w * 0.85)
      const id = createMarkdown(editor.store, { x: v.x + (v.w - w) / 2, y: v.y + v.h * 0.2, w, md: SAMPLE })
      editor.setTool('select')
      editor.setSelection([id])
    }

    // iOS sends no dblclick on the board, so edit the selected card from here
    document.getElementById('edit').onclick = () => {
      const s = editor.store.get([...editor.selection][0])
      if (s?.type !== TYPE) return alert('Select a Markdown card first')
      editMarkdown(editor, s.id)
    }
  </script>
</body>
</html>
