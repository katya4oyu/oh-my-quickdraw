<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quickdraw — agent panel example</title>
  <link rel="stylesheet" href="../../vendor/quickdraw/packages/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
  </style>
  <script type="importmap">
    { "imports": {
      "@quickdrawjs/core": "../../vendor/quickdraw/packages/core/src/index.js",
      "quickdraw-agent": "../../packages/quickdraw-agent/src/index.js",
      "quickdraw-frames": "../../packages/quickdraw-frames/src/index.js",
      "quickdraw-markdown": "../../packages/quickdraw-markdown/src/index.js",
      "quickdraw-embed": "../../packages/quickdraw-embed/src/index.js",
      "quickdraw-toolbar": "../../packages/quickdraw-toolbar/src/index.js"
    } }
  </script>
</head>
<body>
  <div id="board"></div>
  <script type="module">
    import { createQuickdraw } from '@quickdrawjs/core'
    import { BOARD_TOOLS, createAgentPanel, agentTools } from 'quickdraw-agent'
    import { createToolbar } from 'quickdraw-toolbar'

    const board = createQuickdraw({ container: document.getElementById('board') })
    const { editor } = board
    const agents = [{ id: 'board-ai', name: 'Board AI', knows: ['This board', 'The web'], status: 'idle' }]
    const listeners = new Set()
    const storageKey = 'quickdraw-agent-example-threads'
    const readThreads = () => {
      try { return JSON.parse(localStorage.getItem(storageKey) || '[]') } catch { return [] }
    }
    const writeThreads = (threads) => localStorage.setItem(storageKey, JSON.stringify(threads))
    const waiting = new Map()
    let requests = 0
    const emit = (event) => {
      const threads = readThreads()
      const thread = threads.find((item) => item.request.id === event.requestId)
      if (thread) {
        thread.events.push(event)
        if (event.type === 'op') thread.diffs.push(event.diff)
        thread.status = event.type === 'approval' ? 'waiting' : event.type === 'done' || event.type === 'error' ? event.type : 'working'
        writeThreads(threads)
      }
      for (const listener of listeners) listener({ type: 'event', event })
    }
    const host = {
      agents: () => agents,
      threads: readThreads,
      onEvent(fn) { listeners.add(fn); return () => listeners.delete(fn) },
      async ask(request) {
        requests++
        const threads = readThreads()
        threads.push({ request, events: [], diffs: [], status: 'working' })
        writeThreads(threads)
        agents[0].status = 'working'
        listeners.forEach((fn) => fn({ type: 'agents' }))
        emit({ type: 'progress', requestId: request.id, text: 'Reading the board and planning a small change…' })
        await new Promise((resolve) => setTimeout(resolve, 500))
        if (requests % 2 === 0) {
          emit({ type: 'approval', requestId: request.id, id: `approval-${request.id}`, text: 'Add an example frame and notes?' })
          const allow = await new Promise((resolve) => waiting.set(request.id, resolve))
          if (!allow) {
            emit({ type: 'message', requestId: request.id, text: 'Request denied; no board changes made.' })
            emit({ type: 'done', requestId: request.id, text: 'Stopped after denial.' })
            agents[0].status = 'idle'
            listeners.forEach((fn) => fn({ type: 'agents' }))
            return
          }
        }
        // a frame in free space with two notes in it, then the view follows it
        const run = (name, args) => {
          const result = BOARD_TOOLS.find((tool) => tool.name === name).run(editor.store, args, { name: agents[0].name })
          emit({ type: 'op', requestId: request.id, op: result.op, diff: result.diff, ids: result.ids })
          return result
        }
        const frame = run('add_frame', { title: request.text.slice(0, 40), w: 480, h: 280 })
        const f = editor.store.get(frame.ids[0])
        for (const [i, text] of ['Plan the next step', 'Check the result with the team'].entries()) {
          run('add_note', { text, at: { x: f.x + 30 + i * 220, y: f.y + 50 } })
        }
        const box = editor.container.getBoundingClientRect()
        const z = Math.min(1, (box.width - 40) / f.props.w)
        editor.setCamera({ x: box.width / 2 / z - (f.x + f.props.w / 2), y: box.height / 3 / z - (f.y + f.props.h / 2), z }, { animate: 400 })
        emit({ type: 'message', requestId: request.id, text: `Added a frame and two notes for “${request.text}”.` })
        emit({ type: 'done', requestId: request.id, text: 'Board update complete.' })
        agents[0].status = 'idle'
        listeners.forEach((fn) => fn({ type: 'agents' }))
      },
      reply(requestId, message) {
        if (typeof message === 'string') {
          emit({ type: 'message', requestId, text: message })
        } else if ('approval' in message) {
          const resolve = waiting.get(requestId)
          if (resolve) { waiting.delete(requestId); resolve(message.allow) }
        } else if ('undo' in message) {
          const threads = readThreads()
          const thread = threads.find((item) => item.request.id === requestId)
          if (thread) {
            thread.diffs = []
            thread.undoResult = message.undo
            writeThreads(threads)
          }
        }
      },
    }

    const panel = createAgentPanel({ editor, host })
    const ai = agentTools(panel)
    createToolbar(editor, { rail: ai.rail, context: ai.context })

    // two notes to start from, in view on a phone too (a note is 200 × 200)
    const v = editor.viewportPageBounds()
    const narrow = v.w < 520
    const add = BOARD_TOOLS.find((item) => item.name === 'add_note')
    for (const [i, text] of ['Select me and tap ✦', 'Or write a note that starts with @AI'].entries()) {
      const at = narrow
        ? { x: v.x + v.w / 2 - 100, y: v.y + v.h / 2 - 225 + i * 240 }
        : { x: v.x + v.w / 2 - 220 + i * 240, y: v.y + v.h / 2 - 100 }
      add.run(editor.store, { text, at }, { name: 'Example' })
    }
  </script>
</body>
</html>
