<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quickdraw — Yjs example</title>
  <link rel="stylesheet" href="../../vendor/quickdraw/packages/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
  </style>
  <script type="importmap">
    { "imports": { "yjs": "https://esm.sh/yjs@13.6.33" } }
  </script>
</head>
<body>
  <div id="board"></div>
  <script type="module">
    import * as Y from 'yjs'
    import { createQuickdraw } from '../../vendor/quickdraw/packages/core/src/index.js'
    import { bindYjs } from '../../packages/quickdraw-yjs/src/index.js'

    const board = createQuickdraw({ container: document.getElementById('board') })
    const ydoc = new Y.Doc()

    // transport: same-origin tabs over BroadcastChannel; swap in any Yjs provider
    const channel = new BroadcastChannel('quickdraw-yjs')
    ydoc.on('update', (update, origin) => {
      if (origin !== channel) channel.postMessage({ update })
    })
    channel.onmessage = ({ data }) => {
      if (data.update) Y.applyUpdate(ydoc, data.update, channel)
      // a new tab asks for state: reply with everything it is missing
      if (data.sv) channel.postMessage({ update: Y.encodeStateAsUpdate(ydoc, data.sv) })
    }

    bindYjs(board.editor.store, ydoc)
    channel.postMessage({ sv: Y.encodeStateVector(ydoc) })

    window.board = board
    window.ydoc = ydoc
  </script>
</body>
</html>
