<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quickdraw — extensions demo</title>
  <link rel="stylesheet" href="../../vendor/quickdraw/packages/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
    .actions { position: fixed; top: 10px; right: 10px; left: 10px; z-index: 50; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; pointer-events: none; }
    .actions button, .actions select { pointer-events: auto; }
    .actions button, .actions select {
      font: 500 13px system-ui; padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.15); background: #fff; cursor: pointer;
    }
    .cursor { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; font: 600 11px system-ui; }
    .cursor svg { display: block; }
    .cursor span { position: absolute; left: 14px; top: 16px; padding: 1px 6px; border-radius: 6px; color: #fff; white-space: nowrap; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "yjs": "https://esm.sh/yjs@13.6.33",
        "@quickdrawjs/core": "../../vendor/quickdraw/packages/core/src/index.js"
      }
    }
  </script>
</head>
<body>
  <div id="board"></div>
  <div class="actions">
    <select id="aspect" aria-label="Frame aspect ratio">
      <option value="16:9">16:9</option>
      <option value="16:10">16:10</option>
      <option value="4:3">4:3</option>
      <option value="1:1">1:1</option>
      <option value="">Free</option>
    </select>
    <button id="frame">Add frame</button>
    <button id="frame-rename">Rename frame</button>
    <button id="frame-export">Export frame</button>
    <button id="md-add">Add Markdown</button>
    <button id="md-edit">Edit Markdown</button>
    <button id="md-open">Open .md</button>
    <button id="md-save">Save .md</button>
    <button id="import">Import JSON</button>
    <button id="export">Export JSON</button>
  </div>
  <script type="module">
    import * as Y from 'yjs'
    import { createQuickdraw } from '../../vendor/quickdraw/packages/core/src/index.js'
    import { bindYjs } from '../../packages/quickdraw-yjs/src/index.js'
    import { downloadJSON } from '../../packages/quickdraw-export/src/index.js'
    import { openJSON } from '../../packages/quickdraw-import/src/index.js'
    import { bindMarkdownEditing, createMarkdown, downloadMarkdown, editMarkdown, isMarkdownSupported, openMarkdownFile, validateMarkdown, TYPE as MARKDOWN } from '../../packages/quickdraw-markdown/src/index.js'
    import { bindFrames, createFrame, exportFrame, frameTitle, isFrame, renameFrame, setFrameAspect } from '../../packages/quickdraw-frames/src/index.js'

    const board = createQuickdraw({ container: document.getElementById('board') })
    const ydoc = new Y.Doc()

    bindYjs(board.editor.store, ydoc)
    bindFrames(board.editor.store)
    bindMarkdownEditing(board.editor) // before syncing, so remote cards draw too
    // a core without registerShapeType (upstream Quickdraw) cannot draw cards
    if (!isMarkdownSupported()) for (const id of ['md-add', 'md-edit', 'md-open', 'md-save']) document.getElementById(id).hidden = true

    // the selection when there is one, otherwise the whole board
    document.getElementById('export').onclick = () => {
      const { selection } = board.editor
      downloadJSON(board.editor, { ids: selection.size ? selection : null })
    }
    const aspectInput = document.getElementById('aspect')
    const aspect = () => { const [w, h] = aspectInput.value.split(':').map(Number); return h ? w / h : null }
    document.getElementById('frame').onclick = () => {
      const v = board.editor.viewportPageBounds()
      const a = aspect()
      const w = Math.min(480, v.w * 0.8, a ? v.h * 0.6 * a : Infinity), h = Math.min(320, v.h * 0.6)
      const id = createFrame(board.editor.store, { x: v.x + (v.w - w) / 2, y: v.y + (v.h - (a ? w / a : h)) / 2, w, h, aspect: a })
      board.editor.setTool('select')
      board.editor.setSelection([id])
    }
    // the selected frame, or the frame of the selected shape
    const selectedFrame = () => {
      const s = board.editor.store.get([...board.editor.selection][0])
      return isFrame(s) ? s.id : s?.frameId
    }

    // picking a ratio with a frame selected applies it to that frame
    aspectInput.onchange = () => {
      const frameId = selectedFrame()
      if (frameId) setFrameAspect(board.editor.store, frameId, aspect())
    }

    // a prompt, since the core only edits text on double-click, which iOS does not send
    document.getElementById('frame-rename').onclick = () => {
      const frameId = selectedFrame()
      if (!frameId) return alert('Select a frame first')
      const title = prompt('Frame name', frameTitle(board.editor.store, frameId))
      if (title != null) renameFrame(board.editor.store, frameId, title)
    }

    // the frame's contents as a PNG, cut at its edges
    document.getElementById('frame-export').onclick = async () => {
      const { store } = board.editor
      const frameId = selectedFrame()
      if (!frameId) return alert('Select a frame first')
      const blob = await exportFrame(board.editor, frameId)
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = (frameTitle(store, frameId) || 'frame') + '.png'
      a.click()
      setTimeout(() => URL.revokeObjectURL(a.href), 5000)
    }
    document.getElementById('md-add').onclick = () => {
      const v = board.editor.viewportPageBounds()
      const w = Math.min(360, v.w * 0.85)
      const id = createMarkdown(board.editor.store, { x: v.x + (v.w - w) / 2, y: v.y + v.h * 0.2, w })
      board.editor.setTool('select')
      board.editor.setSelection([id])
    }
    const selectedCard = () => {
      const s = board.editor.store.get([...board.editor.selection][0])
      if (s?.type !== MARKDOWN) alert('Select a Markdown card first')
      else return s.id
    }
    // iOS sends no dblclick on the board, so edit the selected card from here
    document.getElementById('md-edit').onclick = () => {
      const id = selectedCard()
      if (id) editMarkdown(board.editor, id)
    }
    document.getElementById('md-open').onclick = () => {
      openMarkdownFile(board.editor).catch((e) => alert(`Open failed: ${e.message}`))
    }
    document.getElementById('md-save').onclick = () => {
      const id = selectedCard()
      if (id) downloadMarkdown(board.editor.store, id)
    }
    document.getElementById('import').onclick = () => {
      // Markdown cards are allowed in, checked by their own validator
      openJSON(board.editor, { types: { [MARKDOWN]: validateMarkdown } }).catch((e) => alert(`Import failed: ${e.message}`))
    }

    // transport: the example server's relay, which also persists the board;
    // swap in any Yjs provider. Messages are one type byte + payload:
    // 0 = update, 1 = state vector (asking the server for what we are missing),
    // 2 = presence (JSON; the server adds the sender's id).
    const UPDATE = 0, SV = 1, PRESENCE = 2
    const pack = (type, data) => { const m = new Uint8Array(data.length + 1); m[0] = type; m.set(data, 1); return m }
    let ws = null
    ydoc.on('update', (update, origin) => {
      if (origin !== 'relay' && ws?.readyState === WebSocket.OPEN) ws.send(pack(UPDATE, update))
    })
    function connect() {
      ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`)
      ws.binaryType = 'arraybuffer'
      ws.onopen = () => {
        // push everything we have (edits made while offline), then ask for the rest
        ws.send(pack(UPDATE, Y.encodeStateAsUpdate(ydoc)))
        ws.send(pack(SV, Y.encodeStateVector(ydoc)))
        sendCursor()
      }
      ws.onmessage = ({ data }) => {
        const m = new Uint8Array(data)
        if (m[0] === UPDATE) Y.applyUpdate(ydoc, m.subarray(1), 'relay')
        else if (m[0] === PRESENCE) showCursor(JSON.parse(new TextDecoder().decode(m.subarray(1))))
      }
      ws.onclose = () => {
        for (const id of cursors.keys()) showCursor({ id, gone: true })
        setTimeout(connect, 1000)
      }
    }

    // live cursors: ours goes out in page coordinates, theirs are drawn over
    // the board and follow the camera
    const editor = board.editor
    const ua = navigator.userAgent
    const me = {
      name: /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : 'Guest',
      color: ['#e03131', '#1971c2', '#2f9e44', '#f08c00', '#9c36b5', '#0c8599'][Math.floor(Math.random() * 6)],
      x: null, y: null,
    }
    let queued = false
    function sendCursor() {
      if (ws?.readyState === WebSocket.OPEN) ws.send(pack(PRESENCE, new TextEncoder().encode(JSON.stringify(me))))
    }
    function moveCursor(p) {
      Object.assign(me, p)
      if (queued) return
      queued = true
      requestAnimationFrame(() => { queued = false; sendCursor() })
    }
    addEventListener('pointermove', (e) => {
      const r = editor.container.getBoundingClientRect()
      moveCursor(editor.screenToPage(e.clientX - r.left, e.clientY - r.top))
    }, { capture: true })
    document.documentElement.addEventListener('pointerleave', () => moveCursor({ x: null, y: null }))

    const cursors = new Map() // id -> { el, x, y }
    function place(c) {
      const r = editor.container.getBoundingClientRect()
      const s = editor.pageToScreen(c.x, c.y)
      c.el.style.transform = `translate(${r.left + s.x}px, ${r.top + s.y}px)`
      c.el.hidden = c.x == null
    }
    function showCursor({ id, gone, name, color, x, y }) {
      let c = cursors.get(id)
      if (gone) { c?.el.remove(); cursors.delete(id); return }
      if (!c) {
        const el = document.createElement('div')
        el.className = 'cursor'
        el.innerHTML = `<svg width="16" height="20" viewBox="0 0 16 20"><path d="M1 1l13 10.5-6 .7L4.7 19z" stroke="#fff" stroke-width="1.5"/></svg><span></span>`
        document.body.append(el)
        cursors.set(id, c = { el })
      }
      c.el.querySelector('path').setAttribute('fill', color)
      const label = c.el.querySelector('span')
      label.textContent = name
      label.style.background = color
      Object.assign(c, { x, y })
      place(c)
    }
    editor.on('camera', () => cursors.forEach(place))
    addEventListener('resize', () => cursors.forEach(place))

    connect()

    window.board = board
    window.ydoc = ydoc
  </script>
</body>
</html>
