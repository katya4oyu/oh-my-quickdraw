<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quickdraw — screen share example</title>
  <link rel="stylesheet" href="../../vendor/quickdraw/packages/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; font: 13px system-ui; }
    main { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #999; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    section { position: relative; background: #fff; }
    section > h2 { position: absolute; z-index: 60; left: 50%; bottom: 8px; transform: translateX(-50%); margin: 0; font: 600 12px system-ui;
      padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; pointer-events: none; }
    .board { position: absolute; inset: 0; }
    .actions { position: absolute; z-index: 60; top: 10px; right: 10px; display: flex; gap: 6px; }
    .actions button { font: 500 13px system-ui; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(0,0,0,.15); background: #fff; cursor: pointer; }
  </style>
  <!-- in your own project, a bundler resolves these from node_modules -->
  <script type="importmap">
    { "imports": {
      "@quickdrawjs/core": "../../vendor/quickdraw/packages/core/src/index.js",
      "quickdraw-frames": "../../packages/quickdraw-frames/src/index.js"
    } }
  </script>
</head>
<body>
  <main>
    <section><div class="board" id="presenter"></div><h2>Presenter</h2>
      <div class="actions"><button id="share">Share a tab…</button><button id="demo">Share a demo app</button></div></section>
    <section><div class="board" id="viewer"></div><h2>Viewer</h2></section>
  </main>
  <script type="module">
    import { createQuickdraw, Store } from '@quickdrawjs/core'
    import { bindFrames } from 'quickdraw-frames'
    import { createScreenShare } from '../../packages/quickdraw-screenshare/src/index.js'

    // two people on one board: here they share one Store (an app syncs it, e.g. quickdraw-yjs)
    const store = new Store()
    bindFrames(store) // what is drawn in a snapshot's frame belongs to it
    const presenter = createQuickdraw({ container: document.getElementById('presenter'), store })
    const viewer = createQuickdraw({ container: document.getElementById('viewer'), store })
    // the core redraws only the first board that asked for a new image once it loads;
    // with two boards on one page, the other one is asked to redraw too
    store.listen(() => setTimeout(() => viewer.editor.requestRender(), 300))

    // the host: in an app, a relay between pages; here the two are wired together
    function hosts() {
      const inbox = { presenter: new Set(), viewer: new Set() }
      let sharing = null // who: 'presenter' | 'viewer'
      const deliver = (to, m) => { for (const fn of inbox[to]) fn(m) }
      const host = (me, other) => ({
        me: () => ({ name: me === 'presenter' ? 'Ann' : 'Bo' }),
        canSend: () => true,
        sendFrame: (data) => deliver(other, { kind: 'frame', data }),
        send(m) {
          if (m.kind === 'start') sharing = me
          if (m.kind === 'stop') sharing = null
          if (m.kind === 'snap') return sharing && deliver(sharing, m)
          const sharer = sharing ? { name: sharing === 'presenter' ? 'Ann' : 'Bo' } : null
          deliver(me, { kind: 'sharing', sharer, mine: sharing === me })
          deliver(other, { kind: 'sharing', sharer, mine: sharing === other })
        },
        onMessage(fn) { inbox[me].add(fn); return () => inbox[me].delete(fn) },
      })
      return { presenter: host('presenter', 'viewer'), viewer: host('viewer', 'presenter') }
    }
    const h = hosts()
    const share = createScreenShare({ editor: presenter.editor, host: h.presenter })
    createScreenShare({ editor: viewer.editor, host: h.viewer })

    // a real tab or window (Chrome, Edge, Safari on a computer), or a made-up app to try it anywhere
    document.getElementById('share').onclick = () => share.start().catch(() => {})
    document.getElementById('demo').onclick = () => share.start(demoApp())
    function demoApp() {
      const c = Object.assign(document.createElement('canvas'), { width: 960, height: 600 })
      const ctx = c.getContext('2d')
      const draw = (t) => {
        ctx.fillStyle = '#f6f7f9'; ctx.fillRect(0, 0, 960, 600)
        ctx.fillStyle = '#2f6fed'; ctx.fillRect(0, 0, 960, 64)
        ctx.fillStyle = '#fff'; ctx.font = '600 24px system-ui'; ctx.fillText('My App', 24, 42)
        ctx.fillStyle = '#222'; ctx.font = '20px system-ui'; ctx.fillText(new Date().toLocaleTimeString(), 24, 120)
        const x = 480 + Math.sin(t / 600) * 300
        ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.arc(x, 330, 40, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = '#2f6fed'; ctx.fillRect(24, 500, 200, 48)
        ctx.fillStyle = '#fff'; ctx.fillText('Save', 96, 531)
        requestAnimationFrame(draw)
      }
      requestAnimationFrame(draw)
      return c.captureStream(30)
    }
  </script>
</body>
</html>
