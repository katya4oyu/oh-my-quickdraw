<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quickdraw — tickets example</title>
  <link rel="stylesheet" href="../../vendor/quickdraw/packages/core/src/quickdraw.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #board { position: fixed; inset: 0; }
    .actions { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 50; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: none; }
    .actions button {
      pointer-events: auto; font: 500 13px system-ui; padding: 6px 12px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.15); background: #fff; cursor: pointer;
    }
  </style>
  <!-- in your own project, a bundler resolves these from node_modules -->
  <script type="importmap">
    { "imports": {
      "@quickdrawjs/core": "../../vendor/quickdraw/packages/core/src/index.js",
      "quickdraw-frames": "../../packages/quickdraw-frames/src/index.js"
    } }
  </script>
</head>
<body>
  <div id="board"></div>
  <!-- a stand-in for an agent: in the app, `quickdraw wait --take` and `quickdraw done` do this -->
  <div class="actions">
    <button id="take">Agent: take the next ticket</button>
    <button id="finish">Agent: finish it</button>
  </div>
  <script type="module">
    import { createQuickdraw, pageBounds } from '@quickdrawjs/core'
    import { bindFrames } from 'quickdraw-frames'
    import { bindKanban, bindTicketEditing, createKanban, createTicket, createTicketBoard, listTickets, placeInColumn, setTicketStatus, ticketTools } from '../../packages/quickdraw-tickets/src/index.js'
    import { createToolbar } from '../../packages/quickdraw-toolbar/src/index.js'

    const board = createQuickdraw({ container: document.getElementById('board') })
    const { editor } = board
    const { store } = editor
    bindFrames(store)
    bindKanban(store) // drag a ticket into another column: its status follows
    bindTicketEditing(editor) // double-click a ticket to edit it

    // the rail adds a ticket (into the kanban in view) or a kanban; the selection bar edits one
    // the team and every ticket, beside the board (the people icon on the rail); roles kept here in memory
    const roles = { Codex: 'researcher', pi: '' }
    const board = createTicketBoard({ editor, team: () => Object.entries(roles).map(([name, role]) => ({ name, role, here: true })), setRole: (name, role) => { roles[name] = role; board.refresh() } })
    const tools = ticketTools({ agents: () => [{ name: 'Codex' }, { name: 'pi' }], me: () => ({ name: 'You' }), board })
    createToolbar(editor, tools)

    const { columns } = createKanban(store, { x: 40, y: 80 })
    for (const [title, body, to] of [
      ['Fix the login page', 'It loops back to the form on Safari', 'Codex'],
      ['Write the README', '', null],
      ['Sketch the settings screen', 'On the board, next to the kanban', 'pi'],
    ]) {
      const id = createTicket(store, { x: 0, y: 0, w: 240, title, body, to, from: 'You' })
      store.update(id, placeInColumn(store, columns.todo, pageBounds(store.get(id)).h, { except: id }))
    }
    store.undos.length = 0 // the starting board is not an edit
    editor.fitContent()

    const AGENT = 'Codex'
    document.getElementById('take').onclick = () => {
      const [next] = listTickets(store, { status: 'todo', for: AGENT })
      if (next) setTicketStatus(store, next.id, 'doing', { by: AGENT })
      else alert(`No ticket for ${AGENT} or any agent to do`)
    }
    document.getElementById('finish').onclick = () => {
      const [mine] = listTickets(store, { status: 'doing' }).filter((s) => s.props.by === AGENT)
      if (mine) setTicketStatus(store, mine.id, 'done', { result: 'Done — see the pull request' })
      else alert(`${AGENT} has no ticket in Doing`)
    }
  </script>
</body>
</html>
